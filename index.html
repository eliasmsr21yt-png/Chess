<style>
:root{--bg:#f4f6fb;--surface:#fff;--text-primary:#14171f;--text-secondary:#5a6272;--text-danger:#d4301f;--border-strong:rgba(20,23,31,.28);--border-stronger:rgba(20,23,31,.5);--radius:10px;color-scheme:light dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--surface:#1a1e29;--text-primary:#f1f3f8;--text-secondary:#a2aabb;--text-danger:#ff6b5e;--border-strong:rgba(255,255,255,.3);--border-stronger:rgba(255,255,255,.5)}}
:root[data-theme="dark"]{--bg:#0e1118;--surface:#1a1e29;--text-primary:#f1f3f8;--text-secondary:#a2aabb;--text-danger:#ff6b5e;--border-strong:rgba(255,255,255,.3);--border-stronger:rgba(255,255,255,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text-primary);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
button,select{font:inherit;color:var(--text-primary);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);padding:8px 14px;min-height:40px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{opacity:.85}
button:focus-visible{outline:3px solid #2979ff;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#wr{position:relative;max-width:480px;margin:0 auto;padding:12px 14px 28px;--a1:#f0d9b5;--b1:#b58863;--c1:rgba(255,235,59,.6);--d1:rgba(124,255,0,.55);--a2:#f0d9b5;--b2:#b58863;--c2:rgba(255,235,59,.6);--d2:rgba(124,255,0,.55);--cw:#fff;--cb:#1a1a1a}
.hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
#st{flex:1;min-width:0;font-size:15px;font-weight:500;min-height:46px;line-height:1.5;padding:0 2px}
#st.fin{background:#ffd600;color:#1a1a1a;border-radius:12px;padding:6px 12px}
#st.fin.dr{background:#2979ff;color:#fff}
#st.fin.ls{background:#ff1744;color:#fff}
#st .u{font-size:13px;font-weight:400;color:var(--text-secondary)}
#st.fin .u{color:inherit;opacity:.75}
.ck{color:#ff1744;font-weight:500}
.rw{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.cl{display:flex;align-items:center;gap:6px;font-size:14px;padding:4px 10px;border-radius:var(--radius);border:1.5px solid transparent;color:var(--text-secondary)}
.cl.on{background:#2979ff;border-color:#2979ff;color:#fff;font-weight:500}
.cl.on.lw{background:#ff1744;border-color:#ff1744}
.tm{font-size:16px;font-variant-numeric:tabular-nums}.lo{color:#ff1744}.cl.on .lo{color:#fff}
.dot{width:12px;height:12px;border-radius:50%;border:.5px solid var(--border-stronger)}
.pn{width:44px;height:36px;padding:0;font-size:18px;display:inline-flex;align-items:center;justify-content:center}
.pn.on{background:#2979ff!important;border-color:#2979ff!important;color:#fff!important}
.mbn{width:auto;padding:0 16px;font-size:15px}
#mn{padding:6px 2px 4px}
.mh{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.mi{width:56px;height:56px;border-radius:16px;background:#2979ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;line-height:1}
.mt{font-size:30px;font-weight:500;line-height:1.1}
.ms{font-size:14px;color:var(--text-secondary);margin-top:2px}
.elo{color:#2979ff;font-weight:500}
.bk{border:none;background:transparent!important;color:#2979ff;font-size:16px;padding:4px 10px 4px 0;margin:0 0 12px;min-height:36px}
.sec{margin-bottom:24px}
.lb{font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:10px}
.cd{display:flex;align-items:center;gap:14px;width:100%;min-height:80px;padding:14px 16px;margin-bottom:12px;border:3px solid transparent;border-radius:18px;background:rgba(127,127,127,.12);text-align:left;color:var(--text-primary)}
.ci{flex:none;width:52px;height:52px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1}
.ct{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.c1{font-size:17px;font-weight:500;color:var(--text-primary)}
.c2{font-size:13px;font-weight:400;color:var(--text-secondary)}
.cv{font-size:28px;color:var(--text-secondary);line-height:1}
.eb{display:flex;flex-direction:column;align-items:center;padding:24px;border-radius:18px;background:#2979ff;color:#fff;margin-bottom:12px}
.e1{font-size:56px;font-weight:500;line-height:1}
.e2{font-size:14px;opacity:.85;margin-top:6px}
.sc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 0 16px;text-align:center}
.spin{width:52px;height:52px;margin-bottom:14px;border-radius:50%;border:6px solid rgba(127,127,127,.25);border-top-color:#2979ff;animation:sp 1s linear infinite}
.spin.ok{border-color:#00c853;animation:none}
.g2,.g3,.g5{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:18px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.op{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;padding:10px 4px;border:3px solid transparent;border-radius:14px;background:rgba(127,127,127,.12);color:var(--text-primary);font-size:15px;font-weight:400}
.op.on{border-color:#2979ff!important;background:rgba(41,121,255,.16)!important;font-weight:500}
.op.rw2{flex-direction:row;justify-content:space-between;width:100%;padding:12px 16px;margin-bottom:8px;text-align:left}
.rw2 .bd2{top:50%;right:10px;transform:translateY(-50%)}
.br{display:flex;align-items:flex-end;gap:3px;margin-right:32px}
.br i{display:block;width:5px;border-radius:2px}
.g5 .op{font-size:12px;padding:8px 2px;min-height:0;gap:6px}
.mb{display:grid;grid-template-columns:1fr 1fr;width:38px;height:38px;border-radius:8px;overflow:hidden}
.pvw{display:grid;grid-template:repeat(8,minmax(0,1fr))/repeat(8,minmax(0,1fr));width:100%;max-width:240px;aspect-ratio:1;container-type:inline-size;border-radius:10px;overflow:hidden;margin:0 auto 22px}
.pvm{display:grid;grid-template:repeat(4,1fr)/repeat(4,1fr);flex:none;width:52px;height:52px;border-radius:10px;overflow:hidden}
.pvw .q,.pvm .q{cursor:default}
.bd2{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:#2979ff;color:#fff;display:flex;align-items:center;justify-content:center}
.sr{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative;width:36px;height:36px;padding:0;min-height:0;border-radius:50%;border:2px solid rgba(127,127,127,.5);display:flex;align-items:center;justify-content:center}

.sw.no{opacity:.3}
.er{font-size:13px;color:var(--text-danger);min-height:22px;margin-bottom:6px}
.go{width:100%;min-height:56px;border-radius:16px;font-size:18px;font-weight:500;background:#00c853!important;border-color:#00c853!important;color:#fff!important}
.rs{width:100%;min-height:48px;margin-top:10px;border-radius:14px}

.we{font-size:26px;font-weight:500;margin-top:10px}
.q{position:relative;display:flex;align-items:center;justify-content:center;background:var(--tl);cursor:pointer}

.q.k::before{background:rgba(255,23,68,.8);animation:chk 1.1s infinite}
.q.pk{outline:3px solid #ff1744;outline-offset:-3px}
.q i{position:absolute;font-size:11px;font-style:normal;font-weight:500;line-height:1;pointer-events:none;color:var(--td)}
.q.d i{color:var(--tl)}
.q .r{top:3px;left:3px}.q .f{bottom:3px;right:3px}
.q.t::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.28);pointer-events:none;animation:pop .16s}
.q.t.c::after{width:100%;height:100%;box-sizing:border-box;border:max(4px,.9cqw) solid rgba(0,0,0,.28);background:none}
.q.s .p{animation:lift .15s forwards}
.p,.mi,.ci{font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2","DejaVu Sans",sans-serif}
.p{position:relative;font-size:10.6cqw;line-height:1;pointer-events:none}
.p.w{color:var(--cw);text-shadow:var(--sw)}
.p.b{color:var(--cb);text-shadow:var(--sb)}
.p.mv{z-index:5}
.p.dn{transform:rotate(80deg) translate(10%,12%)}
.dt{animation:bl 1s infinite}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes lift{to{transform:scale(1.14)}}
@keyframes chk{50%{opacity:.35}}
@keyframes bl{50%{opacity:.2}}
@keyframes sp{to{transform:rotate(360deg)}}
.av{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;margin-right:5px;font-size:.95em;line-height:1;vertical-align:middle;font-family:system-ui,"Apple Color Emoji","Noto Color Emoji",sans-serif}
.cd{box-sizing:border-box}
.g4{display:grid;gap:8px;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:6px}
.q.pm::before{background:rgba(255,109,0,.6)}
.p.pg{opacity:.62}
#pm.on{background:#ff6d00!important;border-color:#ff6d00!important;color:#fff!important}
.pmi{position:relative;display:inline-block;font-size:22px;line-height:1;font-family:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",system-ui,sans-serif}

@keyframes pmz{to{filter:drop-shadow(0 0 4px #ffee58);transform:translateX(-50%) scale(1.2)}}
#tt{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-30px);opacity:0;pointer-events:none;background:#1a1d27;color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;z-index:120;max-width:88vw;text-align:center;transition:opacity .25s,transform .25s}

#iv{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:110;display:none;align-items:center;gap:8px;background:#1a1d27;color:#fff;padding:10px 12px;border-radius:16px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.ivb{border:0;border-radius:10px;padding:8px 10px;font-size:14px;background:#3a3f4f;color:#fff}
.ivb.ok{background:#00c853}
.p.fx-ghost{text-shadow:0 0 6px #fff,0 0 16px #90caf9;animation:gho 2.4s ease-in-out infinite}
@keyframes gho{50%{opacity:.55;filter:blur(.4px)}}
.p.fx-toxic{text-shadow:0 0 5px #1b5e20,0 0 12px #76ff03;animation:tox 1.4s ease-in-out infinite alternate}
@keyframes tox{to{text-shadow:0 0 8px #c6ff00,0 0 20px #64dd17;filter:hue-rotate(25deg)}}
.p.fx-sakura{text-shadow:0 0 5px #fff,0 0 12px #ff80ab;animation:sak 2.8s ease-in-out infinite alternate}
@keyframes sak{to{text-shadow:0 0 4px #fff,0 0 20px #f48fb1;filter:brightness(1.25)}}
.p.fx-sakura::after{content:'\273F';position:absolute;top:-.1em;right:-.1em;font-size:.3em;color:#ff80ab;animation:pet 2.8s linear infinite}
@keyframes pet{0%{opacity:0;top:-.2em}30%{opacity:1}100%{opacity:0;top:.7em}}
.p.fx-thunder{text-shadow:0 0 4px #fff,0 0 14px #b388ff,0 0 26px #651fff;animation:thu 1.9s infinite}
@keyframes thu{0%,70%,100%{filter:none}72%,76%{filter:brightness(3) drop-shadow(0 0 10px #fff)}74%{filter:none}90%{filter:brightness(2) drop-shadow(0 0 8px #e1bee7)}}
.p.fx-thunder::before{content:'\26A1\FE0E';position:absolute;top:-.1em;left:-.12em;font-size:.34em;color:#ffee58;opacity:0;animation:thz 1.9s infinite}
@keyframes thz{0%,70%,100%{opacity:0}72%,76%{opacity:1}74%{opacity:0}90%{opacity:1}}
.p.fx-diamond{color:transparent!important;background:linear-gradient(115deg,#b2ebf2 0%,#fff 20%,#f8bbd0 40%,#fff 55%,#b3e5fc 75%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;text-shadow:none!important;filter:drop-shadow(0 0 1px #006064) drop-shadow(0 0 6px rgba(130,230,255,.9));animation:dia 2.4s linear infinite}
@keyframes dia{to{background-position:-250% 0}}
.p.fx-phoenix{color:transparent!important;background:linear-gradient(180deg,#fff59d 0%,#ffb300 35%,#ff3d00 70%,#b71c1c 100%);background-size:100% 220%;-webkit-background-clip:text;background-clip:text;text-shadow:none!important;filter:drop-shadow(0 0 2px #7f0000) drop-shadow(0 -2px 8px #ff9100);animation:phx 1.1s ease-in-out infinite alternate}
@keyframes phx{to{background-position:0 100%;filter:drop-shadow(0 0 2px #7f0000) drop-shadow(0 -4px 14px #ffea00)}}
.p.fx-phoenix::before{content:'\2726';position:absolute;top:-.12em;left:-.1em;font-size:.3em;color:#ffea00;animation:spk 1.3s linear infinite}
.p.fx-phoenix::after{content:'\2727';position:absolute;top:-.05em;right:-.08em;font-size:.26em;color:#ff9100;animation:spk 1.3s .6s linear infinite}
@keyframes spk{0%{opacity:0;transform:translateY(.2em) scale(.6)}40%{opacity:1}100%{opacity:0;transform:translateY(-.5em) scale(1.1)}}
#bd.galaxy::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:6;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(2px 2px at 40% 80%,#b388ff,transparent),radial-gradient(1.5px 1.5px at 85% 65%,#fff,transparent),radial-gradient(1px 1px at 10% 75%,#80d8ff,transparent),radial-gradient(1.5px 1.5px at 55% 50%,#fff,transparent);animation:twk 3s ease-in-out infinite alternate}
@keyframes twk{from{opacity:.2}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#bd.galaxy::after,#pm.on .pmb{animation:none}}
input{-webkit-user-select:text;user-select:text;font:inherit}
.gh{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-55%) scale(1.25);filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))}
.p.fx-fire{text-shadow:0 0 3px #ffab00,0 -3px 8px #ff3d00,0 -6px 14px #ffea00;animation:fire .8s infinite alternate}
@keyframes fire{to{text-shadow:0 0 6px #ffea00,0 -5px 10px #ff6d00,0 -9px 18px #ff1744}}
.p.fx-bolt{text-shadow:0 0 4px #fff,0 0 12px #40c4ff;animation:bolt 2.2s infinite}
@keyframes bolt{0%,84%,100%{filter:none}86%,90%{filter:brightness(2.6) drop-shadow(0 0 8px #fff)}88%{filter:none}}
.p.fx-bolt::after{content:'\26A1\FE0E';position:absolute;top:-.05em;right:-.15em;font-size:.38em;color:#fff176;opacity:0;animation:bz 2.2s infinite}
@keyframes bz{0%,84%,100%{opacity:0}86%,90%{opacity:1}}
.p.fx-ice{text-shadow:0 0 5px #fff,0 0 12px #00b0ff;animation:ice 2s infinite alternate}
@keyframes ice{to{text-shadow:0 0 3px #fff,0 0 18px #18ffff}}
.p.fx-gold{text-shadow:0 0 4px #fff59d,0 0 12px #ff8f00;animation:gold 1.6s infinite alternate}
@keyframes gold{to{filter:brightness(1.5)}}
.p.fx-neon{text-shadow:0 0 4px #fff,0 0 10px #00e676,0 0 20px #00e676;animation:neon 1.2s infinite alternate}
@keyframes neon{to{opacity:.75}}
.p.fx-rainbow{text-shadow:0 0 8px currentColor;animation:rb 3s linear infinite}

#bd.lava{box-shadow:0 0 22px 4px rgba(255,90,20,.7);animation:lv 1.5s infinite alternate}
@keyframes lv{to{box-shadow:0 0 34px 8px rgba(255,160,20,.9)}}
#bd.storm::after{content:'';position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7;animation:fl 5s infinite}
@keyframes fl{0%,90%,94%,100%{opacity:0}92%{opacity:.55}96%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.p[class*=fx-],#bd.lava,#bd.storm::after{animation:none}}
@media (prefers-reduced-motion:reduce){.q.k::before,.dt,.spin{animation:none}}

/* Neue Shop-Effekte */
.p.fx-aurora{color:transparent!important;background:linear-gradient(135deg,#80deea,#b388ff,#69f0ae,#80deea);background-size:260% 260%;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 7px rgba(128,222,234,.9));animation:auroraGlow 3s ease-in-out infinite}

.p.fx-celestial::before{content:'✦';position:absolute;font-size:.36em;top:-.35em;right:-.25em;color:#fff4b0;text-shadow:0 0 8px #fff,0 0 14px #7c4dff}

/* Mehrspieler-Modi */
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 20px}
.mode-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border:2px solid transparent;border-radius:16px;background:rgba(127,127,127,.12);color:var(--text-primary);min-height:112px}
.mode-card.active{border-color:#2979ff;background:rgba(41,121,255,.14)}
.mode-icon{font-size:27px;line-height:1.1}
.mode-title{font-size:16px;font-weight:600}
.mode-desc{font-size:12px;line-height:1.35;color:var(--text-secondary)}
.party-panel{background:rgba(127,127,127,.09);border:1px solid var(--border);border-radius:16px;padding:12px;margin:12px 0}
.party-row{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--border)}
.party-row:last-child{border-bottom:0}
.party-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#2979ff;color:#fff;flex:none}
.party-status{margin-left:auto;font-size:12px;color:var(--text-secondary)}
.party-field{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--text-primary);font:inherit}
.party-pair{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);align-items:center;gap:7px;margin:7px 0}
.party-rounds{display:flex;gap:14px;overflow-x:auto;padding:8px 2px 12px;scroll-snap-type:x proximity}
.party-round{flex:1 0 185px;min-width:185px;scroll-snap-align:start}
.party-bracket{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.party-match{padding:10px;border-radius:12px;background:rgba(127,127,127,.12);border:1px solid var(--border);font-size:13px}
.party-match strong{display:block;margin-bottom:5px}
.party-match .winner{color:#00a152;font-weight:600}
.party-tag{font-size:11px;padding:3px 7px;border-radius:999px;background:rgba(41,121,255,.14);color:#2979ff}
.party-hint{font-size:12px;color:var(--text-secondary);line-height:1.45}
/* Foto-Vorbild: 8x8-Mitte, je vier 2x8-Startarme, acht Figuren + acht Bauern. */
#bd.ffa{width:100%;min-width:0;max-width:none;aspect-ratio:1;grid-auto-rows:minmax(0,1fr);gap:1px;background:#d5d0c2;touch-action:manipulation;border-radius:0;margin:0 auto;user-select:none;clip-path:none;overflow:visible}
.ffa-board-wrap{width:100%;max-width:452px;aspect-ratio:1;margin:8px auto 12px;padding:clamp(6px,1.5vw,10px);box-sizing:border-box;overflow:auto;overscroll-behavior:contain;background:linear-gradient(145deg,#fffef8 0%,#f2eedf 48%,#d7cfbd 100%);clip-path:polygon(16.6667% 0,83.3333% 0,100% 16.6667%,100% 83.3333%,83.3333% 100%,16.6667% 100%,0 83.3333%,0 16.6667%);box-shadow:inset 0 1px 0 rgba(255,255,255,.94),inset 0 -3px 0 rgba(95,83,61,.18),0 8px 22px rgba(25,40,30,.20);transform:perspective(1100px) rotateX(11deg);transform-origin:center 50%;}
.ffa-board-wrap::-webkit-scrollbar{width:7px;height:7px}.ffa-board-wrap::-webkit-scrollbar-thumb{background:rgba(55,70,60,.35);border-radius:99px}
.fq{position:relative;display:grid;place-items:center;aspect-ratio:1;min-width:0;min-height:0;cursor:pointer;user-select:none;box-sizing:border-box;touch-action:manipulation}

.fq.selected{outline:3px solid #ffc928;outline-offset:-3px;z-index:3}
.fq.ffa-active-start{box-shadow:inset 0 0 0 2px #ffca28,inset 0 0 12px rgba(255,202,40,.38);z-index:1}

.fq.ffa-target::after{content:'';position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(255,196,0,.94);box-shadow:0 1px 5px rgba(0,0,0,.35);pointer-events:none;z-index:2}
.fq.ffa-target.ffa-capture::after{width:86%;height:86%;background:transparent;border:3px solid rgba(255,103,73,.95);box-sizing:border-box}
.fq .fp{font-size:var(--ffa-piece-size,clamp(10px,2.7vw,27px));line-height:1;pointer-events:none;display:block;text-align:center}
.ffa-piece-svg{display:block;width:100%;height:100%;max-width:100%;max-height:100%;overflow:visible;pointer-events:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.28)) drop-shadow(0 0 1px rgba(0,0,0,.16));}
.ffa-topline{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:9px 11px;min-height:54px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.ffa-turn-number{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;padding-right:10px;border-right:1px solid var(--border)}

.ffa-turn-copy{min-width:0;display:flex;flex-direction:column;line-height:1.25}.ffa-turn-copy strong{font-size:15px;white-space:normal;letter-spacing:-.01em}.ffa-turn-copy small{font-size:11px;color:var(--text-secondary)}
.ffa-turn-badge{border-radius:999px;padding:6px 9px;background:rgba(127,127,127,.12);color:var(--text-secondary);font-size:10px;font-weight:800;letter-spacing:.04em;white-space:nowrap}

.ffa-turn-badge.done{background:rgba(41,121,255,.15);color:#2979ff}
#ffa-panel{border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:12px;margin:8px auto 12px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.ffa-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.ffa-panel-head strong{font-size:14px}.ffa-panel-head small{display:block;color:var(--text-secondary);font-size:11px}
.ffa-tools{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap}.ffa-tools button{min-width:38px;min-height:34px;width:auto;padding:0 9px;font-size:14px}

.ffa-player-card{display:flex;align-items:center;gap:7px;min-width:0;padding:8px 9px;border:1px solid var(--border);border-radius:11px;background:rgba(127,127,127,.06);transition:border-color .15s,background .15s}
