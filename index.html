<style>
:root{--bg:#f4f6fb;--surface:#fff;--text-primary:#14171f;--text-secondary:#5a6272;--text-danger:#d4301f;--border-strong:rgba(20,23,31,.28);--border-stronger:rgba(20,23,31,.5);--radius:10px;color-scheme:light dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--surface:#1a1e29;--text-primary:#f1f3f8;--text-secondary:#a2aabb;--text-danger:#ff6b5e;--border-strong:rgba(255,255,255,.3);--border-stronger:rgba(255,255,255,.5)}}
:root[data-theme="dark"]{--bg:#0e1118;--surface:#1a1e29;--text-primary:#f1f3f8;--text-secondary:#a2aabb;--text-danger:#ff6b5e;--border-strong:rgba(255,255,255,.3);--border-stronger:rgba(255,255,255,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text-primary);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
button,select{font:inherit;color:var(--text-primary);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);padding:8px 14px;min-height:40px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{opacity:.85}
button:focus-visible{outline:3px solid #2979ff;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#wr{position:relative;max-width:480px;margin:0 auto;padding:12px 14px 28px;--a1:#f0d9b5;--b1:#b58863;--c1:rgba(255,235,59,.6);--d1:rgba(124,255,0,.55);--a2:#f0d9b5;--b2:#b58863;--c2:rgba(255,235,59,.6);--d2:rgba(124,255,0,.55);--cw:#fff;--cb:#1a1a1a}
.hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
#st{flex:1;min-width:0;font-size:15px;font-weight:500;min-height:46px;line-height:1.5;padding:0 2px}
#st.fin{background:#ffd600;color:#1a1a1a;border-radius:12px;padding:6px 12px}
#st.fin.dr{background:#2979ff;color:#fff}
#st.fin.ls{background:#ff1744;color:#fff}
#st .u{font-size:13px;font-weight:400;color:var(--text-secondary)}
#st.fin .u{color:inherit;opacity:.75}
.ck{color:#ff1744;font-weight:500}
.rw{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.cl{display:flex;align-items:center;gap:6px;font-size:14px;padding:4px 10px;border-radius:var(--radius);border:1.5px solid transparent;color:var(--text-secondary)}
.cl.on{background:#2979ff;border-color:#2979ff;color:#fff;font-weight:500}
.cl.on.lw{background:#ff1744;border-color:#ff1744}
.tm{font-size:16px;font-variant-numeric:tabular-nums}.lo{color:#ff1744}.cl.on .lo{color:#fff}
.dot{width:12px;height:12px;border-radius:50%;border:.5px solid var(--border-stronger)}
.pn{width:44px;height:36px;padding:0;font-size:18px;display:inline-flex;align-items:center;justify-content:center}
.pn.on{background:#2979ff!important;border-color:#2979ff!important;color:#fff!important}
.mbn{width:auto;padding:0 16px;font-size:15px}
#mn{padding:6px 2px 4px}
.mh{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.mi{width:56px;height:56px;border-radius:16px;background:#2979ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;line-height:1}
.mt{font-size:30px;font-weight:500;line-height:1.1}
.ms{font-size:14px;color:var(--text-secondary);margin-top:2px}
.elo{color:#2979ff;font-weight:500}
.bk{border:none;background:transparent!important;color:#2979ff;font-size:16px;padding:4px 10px 4px 0;margin:0 0 12px;min-height:36px}
.sec{margin-bottom:24px}
.lb{font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:10px}
.cd{display:flex;align-items:center;gap:14px;width:100%;min-height:80px;padding:14px 16px;margin-bottom:12px;border:3px solid transparent;border-radius:18px;background:rgba(127,127,127,.12);text-align:left;color:var(--text-primary)}
.ci{flex:none;width:52px;height:52px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1}
.ct{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.c1{font-size:17px;font-weight:500;color:var(--text-primary)}
.c2{font-size:13px;font-weight:400;color:var(--text-secondary)}
.cv{font-size:28px;color:var(--text-secondary);line-height:1}
.eb{display:flex;flex-direction:column;align-items:center;padding:24px;border-radius:18px;background:#2979ff;color:#fff;margin-bottom:12px}
.e1{font-size:56px;font-weight:500;line-height:1}
.e2{font-size:14px;opacity:.85;margin-top:6px}
.sc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 0 16px;text-align:center}
.spin{width:52px;height:52px;margin-bottom:14px;border-radius:50%;border:6px solid rgba(127,127,127,.25);border-top-color:#2979ff;animation:sp 1s linear infinite}
.spin.ok{border-color:#00c853;animation:none}
.g2,.g3,.g5{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:18px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.op{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;padding:10px 4px;border:3px solid transparent;border-radius:14px;background:rgba(127,127,127,.12);color:var(--text-primary);font-size:15px;font-weight:400}
.op.on{border-color:#2979ff!important;background:rgba(41,121,255,.16)!important;font-weight:500}
.op.rw2{flex-direction:row;justify-content:space-between;width:100%;padding:12px 16px;margin-bottom:8px;text-align:left}
.rw2 .bd2{top:50%;right:10px;transform:translateY(-50%)}
.br{display:flex;align-items:flex-end;gap:3px;margin-right:32px}
.br i{display:block;width:5px;border-radius:2px}
.g5 .op{font-size:12px;padding:8px 2px;min-height:0;gap:6px}
.mb{display:grid;grid-template-columns:1fr 1fr;width:38px;height:38px;border-radius:8px;overflow:hidden}
.pvw{display:grid;grid-template:repeat(8,minmax(0,1fr))/repeat(8,minmax(0,1fr));width:100%;max-width:240px;aspect-ratio:1;container-type:inline-size;border-radius:10px;overflow:hidden;margin:0 auto 22px}
.pvm{display:grid;grid-template:repeat(4,1fr)/repeat(4,1fr);flex:none;width:52px;height:52px;border-radius:10px;overflow:hidden}
.pvw .q,.pvm .q{cursor:default}
.bd2{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:#2979ff;color:#fff;display:flex;align-items:center;justify-content:center}
.sr{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative;width:36px;height:36px;padding:0;min-height:0;border-radius:50%;border:2px solid rgba(127,127,127,.5);display:flex;align-items:center;justify-content:center}

.sw.no{opacity:.3}
.er{font-size:13px;color:var(--text-danger);min-height:22px;margin-bottom:6px}
.go{width:100%;min-height:56px;border-radius:16px;font-size:18px;font-weight:500;background:#00c853!important;border-color:#00c853!important;color:#fff!important}
.rs{width:100%;min-height:48px;margin-top:10px;border-radius:14px}
